apiVersion: v1
kind: Pod
metadata:
  name: cpu-stress
  namespace: kubewise-demo
  labels:
    app: cpu-stress
spec:
  restartPolicy: Never
  containers:
    - name: stress
      image: busybox:1.36
      command:
        - sh
        - -c
        - while true; do :; done
      resources:
        requests:
          cpu: 100m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 64Mi